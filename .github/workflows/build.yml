name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Environment
        run: |
          xcodegen --version
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Confirm the project format matches what this Xcode can open.
          grep -m2 -E 'archiveVersion|objectVersion' TimestampCam.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TimestampCam.xcodeproj \
            -scheme TimestampCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TimestampCam.app Payload/
          zip -qry TimestampCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TimestampCam-ipa
          path: TimestampCam.ipa
          retention-days: 30
