name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Environment
        run: |
          xcodegen --version
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Confirm the project format matches what this Xcode can open.
          grep -m2 -E 'archiveVersion|objectVersion' TimestampCam.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project TimestampCam.xcodeproj \
            -scheme TimestampCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign so Sideloadly can re-sign
        run: |
          # xcodebuild refuses ad-hoc signing against the iOS SDK ("Ad Hoc code
          # signing is not allowed with SDK 'iOS 17.5'"), but the codesign tool
          # has no such restriction. Sideloadly re-signs by REPLACING an existing
          # signature; with none present the binary has no LC_CODE_SIGNATURE and
          # the device rejects the install as "Guru Meditation ... Invalid file".
          APP=build/Build/Products/Release-iphoneos/TimestampCam.app
          codesign --force --sign - "$APP"
          otool -l "$APP/TimestampCam" | grep -q LC_CODE_SIGNATURE \
            || { echo "::error::binary still lacks LC_CODE_SIGNATURE"; exit 1; }
          test -d "$APP/_CodeSignature" \
            || { echo "::error::no _CodeSignature directory"; exit 1; }
          codesign -dv "$APP"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TimestampCam.app Payload/
          zip -qry TimestampCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TimestampCam-ipa
          path: TimestampCam.ipa
          retention-days: 30
